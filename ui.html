<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: http: data:">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: #fff; font: 13px -apple-system, system-ui, sans-serif; user-select: none; }
  #sidebar { position: absolute; inset: 0 auto 0 0; width: 240px; display: flex; flex-direction: column; padding: 44px 8px 8px; }
  #space-name { font-weight: 600; padding: 0 8px 8px; opacity: .85; }
  #tabs { flex: 1; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: default; white-space: nowrap; overflow: hidden; }
  .row:hover { background: rgba(255,255,255,.12); }
  .row.active { background: rgba(255,255,255,.28); }
  .row img, .row .dot { width: 16px; height: 16px; flex: none; border-radius: 3px; }
  .row .dot { background: rgba(255,255,255,.3); }
  .row span { overflow: hidden; text-overflow: ellipsis; }
  .children { padding-left: 14px; }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,.25); margin: 8px; }
  #new { opacity: .7; }
  #backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); }
  #palette { display: none; position: fixed; top: 18%; left: 50%; transform: translateX(-50%); width: min(640px, 80vw); background: #1f1f23; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; }
  body.palette #backdrop, body.palette #palette { display: block; }
  #palette input { width: 100%; border: 0; outline: 0; padding: 16px; font-size: 17px; background: transparent; color: #fff; }
  #results .row { margin: 0 6px 6px; }
  #spaces { display: flex; gap: 6px; justify-content: center; padding-top: 8px; }
  #spaces button { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: default; color: #fff; background: rgba(255,255,255,.2); font-size: 12px; line-height: 12px; }
  #spaces button.active { border-color: #fff; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="space-name"></div>
  <div id="tabs"></div>
  <div id="spaces"></div>
</div>
<div id="backdrop"></div>
<div id="palette">
  <input id="query" placeholder="Search or enter URL" spellcheck="false">
  <div id="results"></div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const el = (tag, cls, text) => {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text) e.textContent = text
  return e
}

function tabRow(t, activeId) {
  const r = el('div', 'row' + (t.id === activeId ? ' active' : ''))
  if (t.favicon) {
    const img = el('img')
    img.src = t.favicon
    img.onerror = () => img.replaceWith(el('div', 'dot'))
    r.append(img)
  } else r.append(el('div', 'dot'))
  r.append(el('span', '', t.title || t.url))
  r.title = t.url
  r.onclick = () => { document.body.classList.remove('palette'); camber.send('select', t.id) }
  return r
}

let current, mode, picked = 0

camber.onState(({ state, sidebarOpen }) => {
  current = state
  $('sidebar').style.visibility = sidebarOpen ? '' : 'hidden'
  const s = state.spaces[state.active]
  $('space-name').textContent = s.name
  const box = $('tabs')
  box.replaceChildren()
  s.pinned.forEach((it, i) => {
    if (!it.children) return box.append(tabRow(it, s.activeId))
    const f = el('div', 'row')
    f.append(el('span', '', (it.open ? '▾ ' : '▸ ') + it.title))
    f.onclick = () => camber.send('toggleFolder', i)
    box.append(f)
    if (it.open) {
      const c = el('div', 'children')
      it.children.forEach((t) => c.append(tabRow(t, s.activeId)))
      box.append(c)
    }
  })
  box.append(el('hr'))
  const nt = el('div', 'row', '+ New Tab')
  nt.id = 'new'
  nt.onclick = () => camber.send('openPalette', 'new')
  box.append(nt)
  s.today.forEach((t) => box.append(tabRow(t, s.activeId)))

  const bar = $('spaces')
  bar.replaceChildren()
  state.spaces.forEach((sp, i) => {
    const b = el('button', i === state.active ? 'active' : '')
    b.style.background = sp.color
    b.title = sp.name
    b.onclick = () => camber.send('showSpace', i)
    bar.append(b)
  })
  const add = el('button', '', '+')
  add.title = 'New space'
  add.onclick = () => camber.send('newSpace')
  bar.append(add)
})

// subsequence match: every query char in order; tighter spans score lower (better)
function fuzzy(q, text) {
  text = text.toLowerCase()
  let start = -1, pos = -1
  for (const ch of q) {
    pos = text.indexOf(ch, pos + 1)
    if (pos < 0) return null
    if (start < 0) start = pos
  }
  return pos - start + start / 100
}

function tabsOf(s) {
  return [...s.pinned, ...s.today].flatMap((it) => it.children || [it])
}

function matches() {
  const q = $('query').value.trim().toLowerCase()
  if (!q || !current) return []
  return tabsOf(current.spaces[current.active])
    .map((t) => ({ t, score: fuzzy(q, (t.title || '') + ' ' + t.url) }))
    .filter((m) => m.score !== null)
    .sort((a, b) => a.score - b.score)
    .slice(0, 6)
    .map((m) => m.t)
}

function showResults() {
  const list = matches()
  picked = Math.min(picked, list.length)
  const box = $('results')
  box.replaceChildren()
  list.forEach((t, i) => {
    const r = tabRow(t)
    if (i + 1 === picked) r.classList.add('active')
    box.append(r)
  })
}

camber.onPalette(({ mode: m, url }) => {
  mode = m
  picked = 0
  document.body.classList.add('palette')
  const q = $('query')
  q.value = url
  q.focus()
  q.select()
  showResults()
})

const close = () => { document.body.classList.remove('palette'); camber.send('closePalette') }
$('backdrop').onclick = close
$('query').oninput = () => { picked = 0; showResults() }
// picked 0 means "go to what I typed", 1..n means the nth matching tab
$('query').onkeydown = (e) => {
  const list = matches()
  if (e.key === 'Escape') close()
  else if (e.key === 'ArrowDown') { picked = Math.min(picked + 1, list.length); showResults() }
  else if (e.key === 'ArrowUp') { picked = Math.max(picked - 1, 0); showResults() }
  else if (e.key === 'Enter') {
    document.body.classList.remove('palette')
    if (picked) camber.send('select', list[picked - 1].id)
    else if (e.target.value.trim()) camber.send('go', e.target.value, mode)
    else camber.send('closePalette')
  } else return
  e.preventDefault()
}
</script>
</body>
</html>
