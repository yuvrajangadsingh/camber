<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: http: data: crx:">
<style>
  :root {
    --c: #5b6ee1;
    --text: #1d1d1f; --muted: rgba(29,29,31,.55); --line: rgba(0,0,0,.08);
    --hover: rgba(255,255,255,.35); --active: rgba(255,255,255,.82); --pill: rgba(255,255,255,.45);
    --tint-a: 58%; --tint-b: 34%; --mix: #fff;
    --panel: rgba(250,250,252,.97); --scrim: rgba(20,20,30,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f2f4; --muted: rgba(242,242,244,.55); --line: rgba(255,255,255,.1);
      --hover: rgba(255,255,255,.08); --active: rgba(255,255,255,.17); --pill: rgba(255,255,255,.09);
      --tint-a: 42%; --tint-b: 22%; --mix: #141416;
      --panel: rgba(38,38,42,.97); --scrim: rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); font: 13px system-ui, -apple-system, sans-serif; user-select: none; cursor: default; }
  body { background: linear-gradient(165deg, color-mix(in oklab, var(--c) var(--tint-a), var(--mix)), color-mix(in oklab, var(--c) var(--tint-b), var(--mix))); transition: background .25s; }

  #sidebar { position: absolute; inset: 0 auto 0 0; width: 248px; display: flex; flex-direction: column; padding: 0 8px 10px 10px; }
  /* row 1: the OS traffic lights sit at x 18-87, y 18-32 (trafficLightPosition in main.js) */
  /* windows/linux: no traffic lights, nav starts at the left; the strip above the page drags the window */
  body:not(.mac) #drag { justify-content: flex-start; height: 40px; }
  #titlebar { display: none; position: fixed; top: 0; left: 248px; right: 0; height: 40px; -webkit-app-region: drag; }
  body:not(.mac) #titlebar { display: block; }
  #drag { height: 50px; flex: none; -webkit-app-region: drag; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding-top: 0; }
  #drag button { -webkit-app-region: no-drag; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--text); opacity: .72; display: grid; place-items: center; padding: 0; }
  #drag button:hover:not(:disabled) { background: var(--hover); opacity: 1; }
  #drag button:disabled { opacity: .28; }
  #drag svg, #pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #pill { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--pill); color: var(--muted); white-space: nowrap; overflow: hidden; font-size: 13px; }
  #pill svg { width: 13px; height: 13px; flex: none; stroke-width: 1.8; }
  #pill .host { color: var(--text); }
  #pill .path { color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: none; }
  #pill:hover { background: var(--active); }
  #pill:hover .path { display: inline; }
  #pill .host { overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 100%; }
  #favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-top: 10px; }
  #favs:empty { display: none; }
  #favs .fav { height: 44px; border-radius: 10px; background: var(--pill); display: grid; place-items: center; }
  #favs .fav:hover { background: var(--hover); }
  #favs .fav.active { background: var(--active); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  #favs .icon { width: 20px; height: 20px; border-radius: 5px; }
  #space-name { font-weight: 600; font-size: 12px; letter-spacing: .02em; color: var(--muted); padding: 14px 8px 6px; }
  #space-name input { width: 100%; margin: -3px 0 -3px -4px; padding: 2px 4px; border: 0; border-radius: 5px; outline: 1.5px solid var(--c); font: inherit; letter-spacing: inherit; color: var(--text); background: var(--active); }
  #tabs { flex: 1; overflow-y: auto; margin: 0 -2px; padding: 0 2px; }
  #tabs::-webkit-scrollbar { display: none; }

  .row { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 9px; border-radius: 9px; white-space: nowrap; overflow: hidden; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--active); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .row span { overflow: hidden; text-overflow: ellipsis; }
  .row .close { display: none; margin: 0 -4px 0 auto; flex: none; width: 22px; height: 22px; border: 0; border-radius: 6px; padding: 0; background: transparent; color: var(--muted); font-size: 15px; line-height: 22px; }
  .row:hover .close { display: block; }
  .row .close:hover { background: var(--hover); color: var(--text); }
  .icon { width: 16px; height: 16px; flex: none; border-radius: 4px; }
  .letter { display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; }
  .caret { width: 16px; flex: none; text-align: center; color: var(--muted); transition: transform .15s; }
  .folder.open .caret { transform: rotate(90deg); }
  .folder span { font-weight: 500; }
  .children { margin-left: 17px; padding-left: 6px; border-left: 1px solid var(--line); }
  /* the line is drawn 1px tall in a 21px box so it is easy to drop onto */
  .sep { height: 21px; margin: 0 8px; background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat; border-radius: 9px; }
  .drop-before { box-shadow: inset 0 2px 0 var(--c) !important; }
  .drop-after { box-shadow: inset 0 -2px 0 var(--c) !important; }
  .drop-inside, .sep.drop-end, .row.drop-start { background-color: var(--hover); box-shadow: inset 0 0 0 1.5px var(--c) !important; }
  .muted { color: var(--muted); }
  .plus { display: grid; place-items: center; font-size: 15px; }

  #update { display: flex; align-items: center; gap: 6px; margin: 8px 0 4px; padding: 0 4px 0 10px; height: 34px; border-radius: 9px; background: var(--active); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  #update[hidden] { display: none; }
  #update a { flex: 1; color: var(--text); text-decoration: none; font-weight: 600; cursor: pointer; }
  #update button { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 15px; }
  #update button:hover { background: var(--hover); }
  #import { margin: 8px 0 4px; height: 34px; border: 0; border-radius: 9px; background: var(--active); color: var(--text); font: inherit; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  #actions { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 2px 0; }
  #actions::part(action) { width: 28px; height: 28px; border-radius: 7px; background-color: transparent; }
  #actions::part(action):hover { background-color: var(--hover); }
  #spaces { display: flex; gap: 10px; justify-content: center; align-items: center; padding-top: 10px; }
  #spaces button { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; opacity: .5; transition: transform .15s, opacity .15s; }
  #spaces button:hover { opacity: .85; }
  #spaces button.active { opacity: 1; transform: scale(1.35); box-shadow: 0 0 0 2px var(--mix), 0 0 0 3.5px var(--text); }
  #spaces .add { width: 18px; height: 18px; background: transparent; color: var(--muted); font-size: 15px; line-height: 18px; opacity: 1; }

  /* split view: the active pane's 2px accent ring, drawn in the gap around the page view */
  #pane { display: none; position: fixed; border: 2px solid var(--c); border-radius: 12px; }

  #scrim, #snap, #palette { display: none; }
  body.palette #scrim, body.palette #palette { display: block; }
  body.palette #snap[src], body.peek #snap[src], body.peek #scrim { display: block; }
  #snap { position: fixed; border-radius: 10px; }
  #scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(14px) saturate(1.2); }
  /* the page view sits inside this panel, below the strip (main.js fitPeek) */
  #peek { display: none; position: fixed; border-radius: 12px; background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.35), 0 0 0 1px var(--line); }
  body.peek #peek { display: block; }
  #peek-bar { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 14px; color: var(--muted); }
  #peek-bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #peek-bar button { height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: var(--pill); color: var(--text); font: inherit; font-weight: 600; }
  #peek-bar button:hover { background: var(--hover); }
  #palette { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 80px)); background: var(--panel); border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.2); overflow: hidden; }
  #palette input { width: 100%; height: 56px; border: 0; outline: 0; padding: 0 20px; font: 18px system-ui, -apple-system, sans-serif; background: transparent; color: var(--text); }
  #results:not(:empty) { border-top: 1px solid var(--line); padding: 6px; }
  #results .row { height: 40px; }
  #results .row.active { background: var(--c); color: #fff; box-shadow: none; }
  #results .hint { margin-left: auto; font-size: 11px; opacity: .6; }
</style>
</head>
<body>
<div id="titlebar"></div>
<div id="sidebar">
  <div id="drag">
    <button id="nav-sidebar" title="Toggle sidebar (⌘S)"><svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M7.5 3.5v13"/></svg></button>
    <button id="nav-back" title="Back (⌘[)"><svg viewBox="0 0 20 20"><path d="M12 4.5 6.5 10l5.5 5.5"/></svg></button>
    <button id="nav-forward" title="Forward (⌘])"><svg viewBox="0 0 20 20"><path d="M8 4.5l5.5 5.5L8 15.5"/></svg></button>
    <button id="nav-reload" title="Reload (⌘R)"><svg viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9"/><path d="M15.5 3.5v3.2h-3.2"/></svg></button>
  </div>
  <div id="pill"><svg id="lock" viewBox="0 0 14 14"><rect x="3" y="6.2" width="8" height="5.8" rx="1.4"/><path d="M4.8 6.2V4.6a2.2 2.2 0 0 1 4.4 0v1.6"/></svg><span class="host"></span><span class="path"></span></div>
  <div id="favs"></div>
  <div id="space-name"></div>
  <div id="tabs"></div>
  <div id="update" hidden><a></a><button title="Dismiss">×</button></div>
  <button id="import" hidden>Import from Arc</button>
  <browser-action-list id="actions" alignment="top right"></browser-action-list>
  <div id="spaces"></div>
</div>
<div id="pane"></div>
<img id="snap" alt="">
<div id="scrim"></div>
<div id="peek"><div id="peek-bar"><span></span><button title="Open as tab (⌘O)">Open as tab</button></div></div>
<div id="palette">
  <input id="query" placeholder="Search or enter URL" spellcheck="false">
  <div id="results"></div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const el = (tag, cls, text) => {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text) e.textContent = text
  return e
}
const host = (url) => { try { return new URL(url).hostname.replace(/^www\./, '') } catch { return '' } }

function letterTile(url) {
  const h = host(url) || '?'
  const tile = el('div', 'icon letter', h[0].toUpperCase())
  const hue = [...h].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 360, 7)
  tile.style.background = `hsl(${hue} 55% 48%)`
  return tile
}

// a letter tile until the page favicon (or the site's /favicon.ico) has actually loaded
function favicon(t) {
  const tile = letterTile(t.url)
  let src = t.favicon
  if (!src) try { const u = new URL(t.url); if (u.protocol.startsWith('http')) src = u.origin + '/favicon.ico' } catch {}
  if (!src) return tile
  const img = el('img', 'icon')
  img.onload = () => tile.replaceWith(img)
  img.src = src
  return tile
}

function tabRow(t, activeId) {
  const r = el('div', 'row' + (t.id === activeId ? ' active' : ''))
  r.append(favicon(t), el('span', '', t.name || t.title || t.url))
  r.title = t.url
  r.onclick = () => { document.body.classList.remove('palette'); camber.send('select', t.id) }
  return r
}

// a sidebar tab row: hover × closes a today tab and unloads a pinned one, same as Cmd+W
function sidebarRow(t, activeId, today) {
  const r = tabRow(t, activeId)
  const x = el('button', 'close', '×')
  x.title = today ? 'Close tab' : 'Unload tab'
  x.onclick = (e) => { e.stopPropagation(); camber.send('closeTab', t.id) }
  r.append(x)
  // Cmd+Shift+click a pinned tab to peek at it
  const open = r.onclick
  if (!today) r.onclick = (e) => (e.shiftKey && (e.metaKey || e.ctrlKey) ? camber.send('peek', t.id) : open(e))
  r.draggable = true
  r.dataset.drop = t.id
  r.ondragstart = (e) => { e.dataTransfer.setData(DRAG, t.id); e.dataTransfer.effectAllowed = 'move' }
  return r
}

const flat = (list) => list.flatMap((it) => (it.children ? flat(it.children) : [it]))
const tabsOf = (s) => flat([...s.pinned, ...s.today, ...(current.favorites?.[s.profile] || [])])

function renderItems(list, box, activeId) {
  for (const it of list) {
    if (!it.children) { box.append(sidebarRow(it, activeId)); continue }
    const f = el('div', 'row folder' + (it.open ? ' open' : ''))
    f.append(el('div', 'caret', '›'), el('span', '', it.title))
    f.onclick = () => camber.send('toggleFolder', it.id)
    f.dataset.drop = it.id
    box.append(f)
    if (it.open) {
      const c = el('div', 'children')
      renderItems(it.children, c, activeId)
      box.append(c)
    }
  }
}

let current, mode, picked = 0

$('import').onclick = () => camber.send('importArc')
$('update').querySelector('a').onclick = () => camber.send('openUpdate')
$('update').querySelector('button').onclick = () => camber.send('dismissUpdate')
$('pill').onclick = () => camber.send('openPalette', 'edit')
// double-click the space name to rename it: Enter saves, Esc or clicking away cancels
$('space-name').ondblclick = () => {
  const box = $('space-name'), s = current.spaces[current.active]
  if (box.querySelector('input')) return
  const input = el('input')
  input.value = s.name
  input.spellcheck = false
  const done = (name) => { box.textContent = name }
  input.onkeydown = (e) => {
    if (e.key === 'Enter' && input.value.trim()) { camber.send('renameSpace', s.id, input.value); done(input.value.trim()) }
    else if (e.key === 'Escape') done(s.name)
  }
  input.onblur = () => { if (input.isConnected) done(s.name) }
  box.dataset.space = s.id
  box.replaceChildren(input)
  input.focus()
  input.select()
}
for (const [id, cmd] of [['nav-sidebar', 'toggleSidebar'], ['nav-back', 'back'], ['nav-forward', 'forward'], ['nav-reload', 'reload']]) $(id).onclick = () => camber.send(cmd)
const ICONS = { reload: '<path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9"/><path d="M15.5 3.5v3.2h-3.2"/>', stop: '<path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/>' }

let actionsKey
camber.onState(({ state, sidebarOpen, offerArc, tabId, extensionsVersion, nav, platform, update, pane, peek }) => {
  document.body.classList.toggle('peek', !!peek)
  if (peek) {
    Object.assign($('peek').style, { left: peek.x + 'px', top: peek.y + 'px', width: peek.width + 'px', height: peek.height + 'px' })
    $('peek-bar').firstChild.textContent = peek.url
  }
  $('pane').style.display = pane ? 'block' : ''
  if (pane) Object.assign($('pane').style, { left: pane.x - 2 + 'px', top: pane.y - 2 + 'px', width: pane.width + 4 + 'px', height: pane.height + 4 + 'px' })
  $('update').hidden = !update
  if (update) $('update').querySelector('a').textContent = `camber ${update.version} is out`
  document.body.classList.toggle('mac', platform === 'darwin')
  current = state
  const s = state.spaces[state.active]
  // extension buttons for this space's profile session and its active tab; the element
  // only reads its list on creation, so it is rebuilt when the profile or the installed set changes
  const key = s.profile + '/' + extensionsVersion
  if (key !== actionsKey) {
    actionsKey = key
    const fresh = $('actions').cloneNode()
    fresh.setAttribute('partition', 'persist:' + s.profile)
    $('actions').replaceWith(fresh)
  }
  if (tabId) $('actions').setAttribute('tab', tabId)
  document.documentElement.style.setProperty('--c', s.color)
  $('sidebar').style.visibility = sidebarOpen ? '' : 'hidden'
  $('import').hidden = !offerArc
  // a rename in progress survives re-renders, but not a switch to another space
  if (!$('space-name').querySelector('input') || $('space-name').dataset.space !== s.id) $('space-name').textContent = s.name

  const active = tabsOf(s).find((t) => t.id === s.activeId)
  // address pill: lock for https, the domain, and the rest of the url on hover
  let u = null
  try { u = active && new URL(active.url) } catch {}
  $('lock').style.display = u?.protocol === 'https:' ? '' : 'none'
  $('pill').querySelector('.host').textContent = u ? u.hostname.replace(/^www\./, '') || active.url : 'Search or enter URL'
  $('pill').querySelector('.path').textContent = u && u.pathname + u.search !== '/' ? u.pathname + u.search : ''
  $('pill').title = active ? active.url : ''
  $('nav-back').disabled = !nav.back
  $('nav-forward').disabled = !nav.forward
  $('nav-reload').disabled = !active
  $('nav-reload').title = nav.loading ? 'Stop' : 'Reload (⌘R)'
  $('nav-reload').firstChild.innerHTML = nav.loading ? ICONS.stop : ICONS.reload

  const box = $('tabs')
  box.replaceChildren()
  renderItems(s.pinned, box, s.activeId)

  // favorites: an icon grid shared by every space on this profile
  $('favs').replaceChildren(...(state.favorites?.[s.profile] || []).map((t) => {
    const f = el('div', 'fav' + (t.id === s.activeId ? ' active' : ''))
    f.append(favicon(t))
    f.title = t.name || t.title || t.url
    f.onclick = (e) => { document.body.classList.remove('palette'); camber.send(e.shiftKey ? 'peek' : 'select', t.id) }
    return f
  }))
  const sep = el('div', 'sep')
  sep.dataset.drop = 'pinned'
  box.append(sep)
  const nt = el('div', 'row muted')
  nt.dataset.drop = 'today'
  nt.append(el('div', 'icon plus', '+'), el('span', '', 'New Tab'))
  nt.onclick = () => camber.send('openPalette', 'new')
  box.append(nt)
  s.today.forEach((t) => box.append(sidebarRow(t, s.activeId, true)))

  const bar = $('spaces')
  bar.replaceChildren()
  state.spaces.forEach((sp, i) => {
    const b = el('button', i === state.active ? 'active' : '')
    b.style.background = sp.color
    b.title = sp.name
    b.onclick = () => camber.send('showSpace', i)
    bar.append(b)
  })
  const add = el('button', 'add', '+')
  add.title = 'New space'
  add.onclick = () => camber.send('newSpace')
  bar.append(add)
})

// drag to reorder: a tab row takes the drop above or below itself, a folder row above itself
// or inside, the line under the pinned tabs means "pin at the end", New Tab "unpin at the top"
const DRAG = 'application/x-camber-tab'
let marked
function dropSpot(e) {
  const r = e.dataTransfer.types.includes(DRAG) && e.target.closest('[data-drop]')
  if (!r) return null
  const { drop } = r.dataset
  if (drop === 'pinned') return { r, drop, where: 'end' }
  if (drop === 'today') return { r, drop, where: 'start' }
  const { top, height } = r.getBoundingClientRect()
  const low = e.clientY - top > height / 2
  return { r, drop, where: r.classList.contains('folder') ? (low ? 'inside' : 'before') : (low ? 'after' : 'before') }
}
function mark(spot) {
  marked?.classList.remove('drop-before', 'drop-after', 'drop-inside', 'drop-end', 'drop-start')
  marked = spot?.r
  marked?.classList.add('drop-' + spot.where)
}
$('tabs').ondragover = (e) => {
  const spot = dropSpot(e)
  mark(spot)
  if (spot) { e.preventDefault(); e.dataTransfer.dropEffect = 'move' }
}
$('tabs').ondragleave = (e) => { if (!$('tabs').contains(e.relatedTarget)) mark(null) }
$('tabs').ondragend = () => mark(null)
$('tabs').ondrop = (e) => {
  const spot = dropSpot(e)
  mark(null)
  if (!spot) return
  e.preventDefault()
  camber.send('moveTab', e.dataTransfer.getData(DRAG), spot.drop, spot.where)
}

// subsequence match: every query char in order; tighter spans score lower (better)
function fuzzy(q, text) {
  text = text.toLowerCase()
  let start = -1, pos = -1
  for (const ch of q) {
    pos = text.indexOf(ch, pos + 1)
    if (pos < 0) return null
    if (start < 0) start = pos
  }
  return pos - start + start / 100
}

// "Split with…" lists the space's other tabs before anything is typed
function matches() {
  const q = $('query').value.trim().toLowerCase()
  if (!current || (!q && mode !== 'split')) return []
  const s = current.spaces[current.active]
  return tabsOf(s)
    .filter((t) => mode !== 'split' || t.id !== s.activeId)
    .map((t) => ({ t, score: fuzzy(q, [t.name, t.title, t.url].join(' ')) }))
    .filter((m) => m.score !== null)
    .sort((a, b) => a.score - b.score)
    .slice(0, 6)
    .map((m) => m.t)
}

const looksLikeURL = (q) => !/\s/.test(q) && (q.includes('.') || q.includes(':'))

// rows in display order: typed URLs go first; otherwise open tabs first (like Arc) and search last
function items() {
  const q = $('query').value.trim()
  if (mode === 'split') return matches()
  if (!q) return []
  const tabs = matches()
  const split = q.length > 1 && 'split with'.startsWith(q.toLowerCase()) ? [{ action: 'split' }] : []
  return looksLikeURL(q) ? [null, ...tabs] : [...split, ...tabs, null]
}

function splitMode() {
  mode = 'split'
  picked = 0
  $('query').value = ''
  $('query').placeholder = 'Split with…'
  showResults()
}

function showResults() {
  const q = $('query').value.trim()
  const list = items()
  picked = Math.min(picked, Math.max(list.length - 1, 0))
  const box = $('results')
  box.replaceChildren()
  list.forEach((t, i) => {
    let r
    if (t?.action) {
      r = el('div', 'row')
      r.append(el('div', 'icon plus', '◫'), el('span', '', 'Split with…'))
    } else if (t) {
      r = tabRow(t)
      r.append(el('span', 'hint', mode === 'split' ? 'Split' : 'Switch to tab'))
    } else {
      r = el('div', 'row')
      r.append(el('div', 'icon plus', looksLikeURL(q) ? '↗' : '⌕'), el('span', '', looksLikeURL(q) ? q : `Search DuckDuckGo for “${q}”`))
    }
    r.onclick = () => { picked = i; submit() }
    if (i === picked) r.classList.add('active')
    box.append(r)
  })
}

camber.onPalette(({ mode: m, url, backdrop }) => {
  const snap = $('snap')
  if (backdrop) {
    snap.src = backdrop.src
    Object.assign(snap.style, { left: backdrop.x + 'px', top: backdrop.y + 'px', width: backdrop.width + 'px', height: backdrop.height + 'px' })
  } else snap.removeAttribute('src')
  if (m === 'peek') return
  mode = m
  picked = 0
  document.body.classList.add('palette')
  const q = $('query')
  q.value = url
  q.placeholder = mode === 'split' ? 'Split with…' : 'Search or enter URL'
  q.focus()
  q.select()
  showResults()
})

function submit() {
  const t = items()[picked]
  const q = $('query').value
  if (t?.action) return splitMode()
  document.body.classList.remove('palette')
  if (t && mode === 'split') camber.send('split', t.id)
  else if (mode === 'split') camber.send('closePalette')
  else if (t) camber.send('select', t.id)
  else if (q.trim()) camber.send('go', q, mode)
  else camber.send('closePalette')
}

const close = () => { document.body.classList.remove('palette'); camber.send('closePalette') }
$('scrim').onclick = () => (document.body.classList.contains('peek') ? camber.send('closePeek') : close())
$('peek-bar').querySelector('button').onclick = () => camber.send('peekToTab')
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('peek')) camber.send('closePeek') })
$('query').oninput = () => { picked = 0; showResults() }
$('query').onkeydown = (e) => {
  const n = items().length - 1
  if (e.key === 'Escape') close()
  else if (e.key === 'ArrowDown') { picked = Math.min(picked + 1, n); showResults() }
  else if (e.key === 'ArrowUp') { picked = Math.max(picked - 1, 0); showResults() }
  else if (e.key === 'Enter') submit()
  else return
  e.preventDefault()
}
</script>
