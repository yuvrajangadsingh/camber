name: build

on:
  push:
    branches: [main]
    # a v* tag builds everything again and drafts a release from it (the release job below)
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # a newer push to a branch cancels its running build; a tag's running build is never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build: npx electron-builder --win nsis --x64 --publish never
            installer: true
          - name: linux-x64
            os: ubuntu-latest
            build: npx electron-builder --linux AppImage deb --x64 --publish never
            deb: amd64
            appimage: x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            build: npx electron-builder --linux AppImage deb --arm64 --publish never
            deb: arm64
          # macos-13 is retired; this is GitHub's Intel macOS label
          - name: mac-x64
            os: macos-15-intel
            build: npx electron-builder --mac dmg --x64 --publish never
            app: dist/mac/camber.app/Contents/MacOS/camber
          - name: mac-arm64
            os: macos-15
            build: npx electron-builder --mac dmg --arm64 --publish never
            app: dist/mac-arm64/camber.app/Contents/MacOS/camber
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ matrix.name }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Mac: package.json signs ad hoc ("identity": "-") and electron-builder notarizes only when the
      # APPLE_* variables are set, so without the secrets this is the unsigned build it always was.
      # When the Developer ID certificate exists: add APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      # and the certificate as repo secrets, pass the certificate here as CSC_LINK / CSC_KEY_PASSWORD
      # (not before: an empty CSC_LINK fails the build), drop "identity": "-" and add "zip" to the mac
      # targets (electron-updater on macOS reads the zip).
      # Windows: signing (SignPath or Azure Trusted Signing) goes in as a step after this one,
      # signing dist/*.exe before the smoke test and the upload.
      - run: ${{ matrix.build }}
        env:
          APPLE_ID: ${{ matrix.app && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.app && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.app && secrets.APPLE_TEAM_ID || '' }}

      # Linux: install the .deb like a user would, then run it on a virtual display
      - name: smoke test (linux)
        if: matrix.deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ./dist/camber-*-${{ matrix.deb }}.deb
          xvfb-run -a -s "-screen 0 1280x820x24" node .github/smoke.mjs /opt/camber/camber shot-${{ matrix.name }}.png
      # the AppImage has no setuid sandbox helper; say so in the log if it needs --no-sandbox
      - name: smoke test (appimage)
        if: matrix.appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          app=$(ls dist/camber-*-${{ matrix.appimage }}.AppImage)
          shot=shot-${{ matrix.name }}-appimage.png
          if ! xvfb-run -a -s "-screen 0 1280x820x24" node .github/smoke.mjs $app $shot; then
            echo "::warning::AppImage failed with the sandbox on, retrying with --no-sandbox"
            xvfb-run -a -s "-screen 0 1280x820x24" node .github/smoke.mjs $app $shot --no-sandbox
          fi

      # Windows: install the NSIS installer silently, then test the installed app
      - name: smoke test (installed, windows)
        if: matrix.installer
        run: |
          ./dist/camber-*-x64.exe //S
          for i in $(seq 1 60); do [ -f "$LOCALAPPDATA/Programs/camber/camber.exe" ] && break; sleep 2; done
          sleep 10 # let the installer finish writing
          ls -la "$LOCALAPPDATA/Programs/camber/"
          taskkill //IM camber.exe //F 2>/dev/null || true
          node .github/smoke.mjs "$LOCALAPPDATA/Programs/camber/camber.exe" shot-${{ matrix.name }}-installed.png

      - name: smoke test
        if: matrix.app
        run: node .github/smoke.mjs ${{ matrix.app }} shot-${{ matrix.name }}.png

      # the release job publishes these: the latest*.yml files are what the auto-updater in
      # Windows and AppImage builds reads, the .exe blockmap lets it fetch only changed blocks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camber-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.exe.blockmap
            shot-*.png

  # on a v* tag: check the build jobs' files and make a DRAFT release; publishing it stays a
  # person's click on the releases page
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: camber-*
          path: artifacts
      - run: node .github/release.mjs "$GITHUB_REF_NAME" artifacts release/files
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::$GITHUB_REF_NAME is already published, not touching it"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" release/files/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "camber ${GITHUB_REF_NAME#v}" --notes-file release/notes.md release/files/*
          fi
      - name: summary
        run: |
          {
            echo "Draft: https://github.com/$GITHUB_REPOSITORY/releases (publish it there)"
            echo
            echo "Homebrew cask (yuvrajangadsingh/homebrew-tap Casks/camber.rb):"
            echo '```'
            grep -E 'dmg$' release/files/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
